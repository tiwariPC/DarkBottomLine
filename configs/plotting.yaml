process_groups:
  WtoLNuJets:
    type: background
    color: '#bd1f01'
    label: $W(\ell\nu)+$jets
    patterns:
    - WtoLNu-2Jets_PTLNu-40to100
    - WtoLNu-2Jets_PTLNu-100to200
    - WtoLNu-2Jets_PTLNu-200to400
    - WtoLNu-2Jets_PTLNu-400to600
    - WtoLNu-2Jets_PTLNu-600
  Zto2NuJets:
    type: background
    color: '#a96b59'
    label: $Z(\nu\bar{\nu})+$jets
    patterns:
    - Zto2Nu-2Jets_PTNuNu-40to100
    - Zto2Nu-2Jets_PTNuNu-100to200
    - Zto2Nu-2Jets_PTNuNu-200to400
    - Zto2Nu-2Jets_PTNuNu-400to600
    - Zto2Nu-2Jets_PTNuNu-600
  DYto2LJets:
    type: background
    color: '#3f90da'
    label: $Z(\ell\ell)+$jets
    patterns:
    - DYto2L-2Jets_MLL-50-PTLL-40to100
    - DYto2L-2Jets_MLL-50-PTLL-100to200
    - DYto2L-2Jets_MLL-50-PTLL-200to400
    - DYto2L-2Jets_MLL-50-PTLL-400to600
    - DYto2L-2Jets_MLL-50-PTLL-600
