    - VBFH-Hto2B_Par-M-125
    - WminusH-WtoLNu-Hto2B_Par-M-125
    - WplusH-WtoLNu-Hto2B_Par-M-125
    - ZH-Zto2L-Hto2B_Par-M-125
    - ZH-Zto2Nu-Hto2B_Par-M-125
    - GluGluZH-Zto2L-Hto2B_Par-M-125
    - GluGluZH-Zto2Nu-Hto2B_Par-M-125
    - TTH-Hto2B_Par-M-125
