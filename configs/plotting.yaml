    type: background
    color: '#e76300'
    label: $t\bar{t}$
    patterns:
    - TTto2L2Nu
    - TTtoLNu2Q
    - TTto4Q
  singletop:
    type: background
    color: '#ffa90e'
    label: Single $t$
    patterns:
    - TBbarQtoLNu-t-channel-4FS
    - TbarBQtoLNu-t-channel-4FS
    - TBbartoLplusNuBbar-s-channel-4FS
    - TbarBtoLminusNuB-s-channel-4FS
    - TbarWplustoLNu2Q
    - TWminustoLNu2Q
  Diboson:
