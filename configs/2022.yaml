year: 2022
lumi: 7.99  # fb^-1

# Correction file paths (user must provide actual files)
# Electron-ID-SF: year/scenario and working point (see EGM corrections)
# WorkingPoint: Tight, PromptMVA-Tight, Medium, Loose, etc.
corrections:
   pileup: data/corrections/2022/Run3-22CDSep23-Summer22-NanoAODv12_puWeights.json.gz
   pileup_name: "Collisions2022_355100_357900_eraBCD_GoldenJson"
   btagSF: data/corrections/2022/Run3-22CDSep23-Summer22-NanoAODv12_btagging.json.gz
   muonSF_highPT: data/corrections/2022/Run3-22CDSep23-Summer22-NanoAODv12_muon_HighPt.json.gz
   muonSF_lowPT: data/corrections/2022/Run3-22CDSep23-Summer22-NanoAODv12_muon_JPsi.json.gz
   electronSF: data/corrections/2022/Run3-22CDSep23-Summer22-NanoAODv12_electron.json.gz
   electronHLT: data/corrections/2022/Run3-22CDSep23-Summer22-NanoAODv12_electronHlt.json.gz
   jetJEC: data/corrections/2022/Run3-22CDSep23-Summer22-NanoAODv12_jet_jerc.json.gz
   jetJEC_tag: "Summer22_22Sep2023_V3_MC"
   jetJEC_algo: "AK4PFPuppi"
   jetJEC_level: "L1L2L3Res"
   jetJEC_unc: "Total"
   jetid: data/corrections/2022/Run3-22CDSep23-Summer22-NanoAODv12_jetid.json.gz
   # Plain Tight (not TightLeptonVeto): this analysis already does dedicated
   # jet-lepton dR cleaning (clean_jets_from_leptons in objects.py, dr_jet from
   # config.cleaning), so TightLeptonVeto's built-in lepton veto would duplicate it.
   jetid_name: "AK4PUPPI_Tight"

# YAML-driven lepton scale factors (see CorrectionManager._sf_components).
# Components per object are multiplied; SF = 1 outside a component's pt_range.
# "$pt"/"$eta"/"$abseta"/"$syst" in `inputs` are substituted; other entries are literals.
# Muon: JPsi (low pT) below 50 GeV, HighPt file from 50 GeV (its first pt bin).
lepton_sf:
  muon:
    tight_muons:
      - {file: muonSF_lowPT,  name: NUM_TightID_DEN_TrackerMuons, pt_range: [0, 50],
         inputs: ["$abseta", "$pt", "$syst"], syst: {central: nominal, up: systup, down: systdown}}
      - {file: muonSF_highPT, name: NUM_TightID_DEN_GlobalMuonProbes, pt_range: [50, .inf],
         inputs: ["$abseta", "$pt", "$syst"], syst: {central: nominal, up: systup, down: systdown}}
      - {file: muonSF_highPT, name: NUM_probe_TightRelTkIso_DEN_MediumIDProbes, pt_range: [50, .inf],
         inputs: ["$abseta", "$pt", "$syst"], syst: {central: nominal, up: systup, down: systdown}}
    z_sublead_muons:   # loose-only leg of the Z candidate
      - {file: muonSF_lowPT,  name: NUM_LooseID_DEN_TrackerMuons, pt_range: [0, 50],
         inputs: ["$abseta", "$pt", "$syst"], syst: {central: nominal, up: systup, down: systdown}}
      - {file: muonSF_highPT, name: NUM_MediumID_DEN_GlobalMuonProbes, pt_range: [50, .inf],
         inputs: ["$abseta", "$pt", "$syst"], syst: {central: nominal, up: systup, down: systdown}}
  electron_id:
    tight_electrons:
      - {file: electronSF, name: Electron-ID-SF,
         inputs: ["2022Re-recoBCD", "$syst", "Tight", "$eta", "$pt"], syst: {central: sf, up: sfup, down: sfdown}}
    z_sublead_electrons:
      - {file: electronSF, name: Electron-ID-SF,
         inputs: ["2022Re-recoBCD", "$syst", "Loose", "$eta", "$pt"], syst: {central: sf, up: sfup, down: sfdown}}
  electron_hlt:
    tight_electrons:
      - {file: electronHLT, name: Electron-HLT-SF,
         inputs: ["2022Re-recoBCD", "$syst", "HLT_SF_Ele30_TightID", "$eta", "$pt"], syst: {central: sf, up: sfup, down: sfdown}}

# Data sample settings (set is_data: true when running on collision data)
data:
   is_data: false
   golden_json: data/corrections/2022/Cert_Collisions2022_355100_362760_Golden.json

# Trigger paths
triggers:
   MET: ["HLT_PFMETNoMu120_PFMHTNoMu120_IDTight","HLT_PFMETNoMu130_PFMHTNoMu130_IDTight","HLT_PFMETNoMu140_PFMHTNoMu140_IDTight"]
   SingleMuon: ["HLT_IsoMu24", "HLT_IsoMu27"]
   EGamma: ["HLT_Ele30_WPTight_Gsf", "HLT_Photon200"]

# Noise filters
noise_filters:
   - "Flag_goodVertices"
   - "Flag_globalSuperTightHalo2016Filter"
   - "Flag_EcalDeadCellTriggerPrimitiveFilter"
   - "Flag_BadPFMuonFilter"
   - "Flag_BadPFMuonDzFilter"
   - "Flag_hfNoisyHitsFilter"
   - "Flag_eeBadScFilter"

# Object selection cuts
# Preselection: LOOSE id/iso, pt > 10. Region selection: TIGHT id/iso, pt > 20 (leading pt>30 in CRs).
objects:
   muons:
      pt_min: 30.0          # for tight / region selection
      pt_min_loose: 10.0 # for preselection (loose id, pt>10)
      eta_max: 2.4
      id_loose: "loose"
      iso_loose: "loose"
      id_tight: "tight"
      iso_tight: "tight"
      iso_wp_loose: 1    # pfIsoId >= 1 = loose
      iso_wp_tight: 3    # pfIsoId >= 3 = tight

   electrons:
      pt_min: 32.0
      pt_min_loose: 10.0
      eta_max: 2.5
      # loose = cutBased >= id_wp_loose  AND mvaIso_WP90
      # tight = cutBased >= id_wp_tight  AND mvaIso_WP80
      id_wp_loose: 2     # cutBased >= 2 = loose
      id_wp_tight: 4     # cutBased >= 4 = tight

   taus:
      pt_min: 20.0
      eta_max: 2.3
      # Tau is a veto object (no tight WP). DeepTau2018v2p5 WPs:
      id_wp_vsjet: 3     # VSjet >= 3  = VLoose
      id_wp_vse: 1       # VSe   >= 1  = VVVLoose
      id_wp_vsmu: 1      # VSmu  >= 1  = VLoose
      decay_modes: [0, 1, 2, 10, 11]

   jets:
      pt_min: 30.0
      eta_max: 2.5    # paper: |eta| < 2.5
      id: "tight"

   photons:
      pt_min: 15.0
      eta_max: 2.5
      # Veto object: ID = cutBased loose only
      id_wp_loose: 1     # cutBased >= 1 = loose

   fatjets:
      pt_min: 200.0
      eta_max: 2.4
      id: "tight"

# B-tagging working points
btagging:
   algorithm: "PNet"       # PNet, deepJet, deepCSV
   branch: "Jet_btagPNetB"  # NanoAOD branch name
   score: 0.2605    # Run3 2022 PNet medium WP (BTV POG)
   # B-tag SF (correctionlib). shape = continuous SF: correction {sf_name}_shape,
   # evaluate(systematic, flavor, abseta, pt, discriminant).
   sf_name: "particleNet"  # base correction name in btagging.json.gz
   sf_type: "shape"        # Summer22 ships particleNet_shape

# Event selection (aligned with SUS-23-008 / JHEP02(2025)050)
event_selection:
   min_muons: 0
   max_muons: 2
   min_electrons: 0
   max_electrons: 2
   max_taus: 0
   max_photons: 0
   min_jets: 1            # paper: >= 1 jet
   max_jets: 6
   recoil_min: 250.0
   jet1_pt_min: 100.0    # paper: leading jet pT > 100 GeV
   delta_phi_min: 0.5    # paper: min DeltaPhi(jet, pTmiss) > 0.5

# Cleaning parameters
cleaning:
   dr_jet: 0.4
   dr_photon_lep: 0.4   # photon veto: dR cleaning vs loose electrons+muons (Run 2 parity)
