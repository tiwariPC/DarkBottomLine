year: 2026
lumi: 0.0   # To be updated with actual 2026 luminosity

# Correction file paths (user must provide actual files)
corrections:
   pileup: data/corrections/2023/Run3-22EFGSep23-Summer22EE-NanoAODv12_puWeights.json.gz
   pileup_name: "Collisions2023_355100_357900_eraBCD_GoldenJson"
   btagSF: data/corrections/2023/Run3-22EFGSep23-Summer22EE-NanoAODv12_btagging.json.gz
   muonSF_highPT: data/corrections/2023/Run3-22EFGSep23-Summer22EE-NanoAODv12_muon_HighPt.json.gz
   muonSF_highPT_name: "NUM_TightPFIso_DEN_TightID"
   muonSF_lowPT: data/corrections/2023/Run3-22EFGSep23-Summer22EE-NanoAODv12_muon_JPsi.json.gz
   muonSF_lowPT_name: "NUM_LooseID_DEN_TrackerMuons"
   electronSF: data/corrections/2023/Run3-22EFGSep23-Summer22EE-NanoAODv12_electron.json.gz
   electronSF_name: "2023Re-recoBCD"
   electronSF_WP: "Tight"
   electronHLT: data/corrections/2023/Run3-22EFGSep23-Summer22EE-NanoAODv12_electronHlt.json.gz
   electronHLT_name: "2026Prompt"
   electronHLT_WP: "HLT_SF_Ele30_TightID"
   jetJEC: data/corrections/2023/Run3-22EFGSep23-Summer22EE-NanoAODv12_jet_jerc.json.gz
   jetJEC_tag: "Summer26_Prompt_V1_MC"
   jetJEC_algo: "AK4PFPuppi"
   jetJEC_level: "L1L2L3Res"
   jetJEC_unc: "Total"

# Data sample settings (set is_data: true when running on collision data)
data:
   is_data: false
   golden_json: data/corrections/2026/Cert_Collisions2026_Golden.json

# Trigger paths
triggers:
   MET: ["HLT_PFMETNoMu120_PFMHTNoMu120_IDTight","HLT_PFMETNoMu130_PFMHTNoMu130_IDTight","HLT_PFMETNoMu140_PFMHTNoMu140_IDTight"]
   SingleMuon: ["HLT_IsoMu24", "HLT_IsoMu27"]
   EGamma: ["HLT_Ele30_WPTight_Gsf", "HLT_Photon200"]

# MET filters
met_filters:
   - "Flag_goodVertices"
   - "Flag_globalSuperTightHalo2016Filter"
   - "Flag_EcalDeadCellTriggerPrimitiveFilter"
   - "Flag_BadPFMuonFilter"
   - "Flag_BadPFMuonDzFilter"
   - "Flag_hfNoisyHitsFilter"
   - "Flag_eeBadScFilter"
   - "Flag_ecalBadCalibFilter"

# Object selection (preselection: loose pt>10; region: tight pt>20, leading pt>30 in CRs)
objects:
   muons:
      pt_min: 30.0
      pt_min_loose: 10.0
      eta_max: 2.4
      id_loose: "loose"
      iso_loose: "loose"
      id_tight: "tight"
      iso_tight: "tight"
      iso_wp_loose: 1    # pfIsoId >= 1 = loose
      iso_wp_tight: 3    # pfIsoId >= 3 = tight

   electrons:
      pt_min: 32.0
      pt_min_loose: 10.0
      eta_max: 2.5
      id_loose: "loose"
      iso_loose: "loose"
      id_tight: "tight"
      iso_tight: "tight"
      id_wp_loose: 2     # cutBased >= 2 = loose
      id_wp_tight: 4     # cutBased >= 4 = tight

   taus:
      pt_min: 20.0
      eta_max: 2.3
      id_loose: "loose"
      id_tight: "tight"
      id_wp_loose: 4     # deepTau VSjet >= 4 = loose
      id_wp_tight: 16    # deepTau VSjet >= 16 = tight
      decay_modes: [0, 1, 2, 10, 11]

   jets:
      pt_min: 30.0
      eta_max: 2.5
      id: "tight"

   photons:
      pt_min: 15.0
      eta_max: 2.5
      id: "loose"
      id_wp: 1           # cutBased >= 1 = loose

   fatjets:
      pt_min: 200.0
      eta_max: 2.4
      id: "tight"

# B-tagging working points
btagging:
   wp: "medium"   # loose, medium, tight
   algorithm: "deepJet"   # deepJet, deepCSV
   score_loose: 0.0479    # Run3 2023+ deepJet WPs (BTV POG)
   score_medium: 0.2431
   score_tight: 0.6553

# Event selection (aligned with SUS-23-008)
event_selection:
   min_muons: 0
   max_muons: 2
   min_electrons: 0
   max_electrons: 2
   max_taus: 0
   max_photons: 0
   min_jets: 1
   max_jets: 6
   recoil_min: 250.0
   jet1_pt_min: 100.0
   delta_phi_min: 0.5

# Cleaning parameters
cleaning:
   dr_jet: 0.4
