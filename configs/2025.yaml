year: 2025
lumi: 109.96   # To be updated with actual 2024 luminosity

# Correction file paths (user must provide actual files)
corrections:
   pileup: data/corrections/2025/Run3-25Prompt-Summer24-NanoAODv15_puWeights.json.gz
   pileup_name: "Collisions2025_355100_357900_eraBCD_GoldenJson"
   btagSF: data/corrections/2025/Run3-25Prompt-Summer24-NanoAODv15_btagging.json.gz
   muonSF_highPT: data/corrections/2025/Run3-25Prompt-Summer24-NanoAODv15_muon_HighPt.json.gz
   muonSF_highPT_name: "NUM_TightPFIso_DEN_TightID"
   muonSF_lowPT: data/corrections/2025/Run3-25Prompt-Summer24-NanoAODv15_muon_JPsi.json.gz
   muonSF_lowPT_name: "NUM_LooseID_DEN_TrackerMuons"
   electronSF: data/corrections/2025/Run3-25Prompt-Summer24-NanoAODv15_electron.json.gz
   electronSF_name: "2025Re-recoBCD"
   electronSF_WP: "Tight"
   electronHLT: data/corrections/2025/Run3-25Prompt-Summer24-NanoAODv15_electronHlt.json.gz
   electronHLT_name: "2025Prompt"
   electronHLT_WP: "HLT_SF_Ele30_TightID"
   jetJEC: data/corrections/2025/Run3-25Prompt-Summer24-NanoAODv15_jet_jerc.json.gz
   jetJEC_tag: "Summer25_Prompt_V1_MC"
   jetJEC_algo: "AK4PFPuppi"
   jetJEC_level: "L1L2L3Res"
   jetJEC_unc: "Total"

# Data sample settings (set is_data: true when running on collision data)
data:
   is_data: false
   golden_json: data/corrections/2025/Cert_Collisions2025_391658_398903_Golden.json

# Trigger paths
triggers:
   MET: ["HLT_PFMETNoMu120_PFMHTNoMu120_IDTight","HLT_PFMETNoMu130_PFMHTNoMu130_IDTight","HLT_PFMETNoMu140_PFMHTNoMu140_IDTight"]
   SingleMuon: ["HLT_IsoMu24", "HLT_IsoMu27"]
   EGamma: ["HLT_Ele30_WPTight_Gsf", "HLT_Photon200"]

# Noise filters
noise_filters:
   - "Flag_goodVertices"
   - "Flag_globalSuperTightHalo2016Filter"
   - "Flag_EcalDeadCellTriggerPrimitiveFilter"
   - "Flag_BadPFMuonFilter"
   - "Flag_BadPFMuonDzFilter"
   - "Flag_hfNoisyHitsFilter"
   - "Flag_eeBadScFilter"
   - "Flag_ecalBadCalibFilter"

# Object selection (preselection: loose pt>10; region: tight pt>20, leading pt>30 in CRs)
objects:
   muons:
      pt_min: 30.0
      pt_min_loose: 10.0
      eta_max: 2.4
      id_loose: "loose"
      iso_loose: "loose"
      id_tight: "tight"
      iso_tight: "tight"
      iso_wp_loose: 1    # pfIsoId >= 1 = loose
      iso_wp_tight: 3    # pfIsoId >= 3 = tight

   electrons:
      pt_min: 32.0
      pt_min_loose: 10.0
      eta_max: 2.5
      # loose = cutBased >= id_wp_loose  AND mvaIso_WP90
      # tight = cutBased >= id_wp_tight  AND mvaIso_WP80
      id_wp_loose: 2     # cutBased >= 2 = loose
      id_wp_tight: 4     # cutBased >= 4 = tight

   taus:
      pt_min: 20.0
      eta_max: 2.3
      # Tau is a veto object (no tight WP). DeepTau2018v2p5 WPs:
      id_wp_vsjet: 3     # VSjet >= 3  = VLoose
      id_wp_vse: 1       # VSe   >= 1  = VVVLoose
      id_wp_vsmu: 1      # VSmu  >= 1  = VLoose
      decay_modes: [0, 1, 2, 10, 11]

   jets:
      pt_min: 30.0
      eta_max: 2.5
      id: "tight"

   photons:
      pt_min: 15.0
      eta_max: 2.5
      # Veto object: ID = cutBased loose only
      id_wp_loose: 1     # cutBased >= 1 = loose

   fatjets:
      pt_min: 200.0
      eta_max: 2.4
      id: "tight"

# B-tagging working points
btagging:
   # BTV POG b-tag working points (WP = discriminant cut, Eff = b-eff %, MR = mistag %)
   #            DeepJet                UParT                  ParticleNet
   # WP         WP      Eff   MR       WP      Eff   MR       WP      Eff   MR
   # Loose      0.0485  91.9  10.0     0.0246  92.6  10.0     0.0365  93.2  10.0
   # Medium     0.2480  82.1   1.0     0.1272  83.4   1.0     0.1990  84.2   1.0
   # Tight      0.6708  67.2   0.1     0.4648  72.4   0.1     0.6373  70.6   0.1
   # XTight     0.7846  61.9   0.05    0.6298  68.1   0.05    0.7764  65.4   0.05
   # XXTight    0.9654  42.7   0.01    0.9739  48.3   0.01    0.9815  44.6   0.01
   algorithm: "PNet"       # PNet, deepJet, deepCSV
   branch: "Jet_btagPNetB"  # NanoAOD branch name
   score: 0.2431    # Run3 2023+ PNet medium WP (BTV POG)

# Event selection (aligned with SUS-23-008)
event_selection:
   min_muons: 0
   max_muons: 2
   min_electrons: 0
   max_electrons: 2
   max_taus: 0
   max_photons: 0
   min_jets: 1
   max_jets: 6
   recoil_min: 250.0
   jet1_pt_min: 100.0
   delta_phi_min: 0.5

# Cleaning parameters
cleaning:
   dr_jet: 0.4
